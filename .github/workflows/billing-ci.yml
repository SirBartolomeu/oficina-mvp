name: billing-ci

on:
  push:
    branches: [main]
    paths: ['services/Oficina.Billing/**', 'services/Oficina.Billing.Tests/**', 'services/Oficina.Billing.Dynamo.Tests/**', 'scripts/validate-service-coverage.ps1', 'k8s/services/billing/**', 'global.json', '.github/workflows/billing-ci.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Billing tests
        run: dotnet test services/Oficina.Billing.Tests --configuration Release --collect:"XPlat Code Coverage" --logger trx --results-directory test-results/billing
      - name: Start DynamoDB Local for integration tests
        run: |
          docker run --rm -d --name oficina-billing-dynamo -p 127.0.0.1:8000:8000 amazon/dynamodb-local:latest -jar DynamoDBLocal.jar -inMemory -sharedDb
          for attempt in {1..30}; do
            if curl --silent --output /dev/null http://127.0.0.1:8000; then exit 0; fi
            sleep 2
          done
          docker logs oficina-billing-dynamo
          exit 1
      - name: Start SQS emulator for message flow
        run: |
          docker run --rm -d --name oficina-billing-sqs -p 127.0.0.1:9324:9324 softwaremill/elasticmq-native:latest
          for attempt in {1..30}; do
            if curl --silent --output /dev/null http://127.0.0.1:9324; then exit 0; fi
            sleep 2
          done
          docker logs oficina-billing-sqs
          exit 1
      - name: Billing DynamoDB integration tests
        env:
          BILLING_DYNAMO_ENDPOINT: http://127.0.0.1:8000
          MESSAGING_SQS_ENDPOINT: http://127.0.0.1:9324
        run: dotnet test services/Oficina.Billing.Dynamo.Tests --configuration Release --collect:"XPlat Code Coverage" --logger trx --results-directory test-results/billing-dynamo
      - name: Billing 80% coverage gate
        shell: pwsh
        run: ./scripts/validate-service-coverage.ps1 -AssemblyName Oficina.Billing -UnitResultsDirectory test-results/billing -IntegrationResultsDirectory test-results/billing-dynamo -Minimum 80
      - name: Build Billing container
        run: docker build -f services/Oficina.Billing/Dockerfile -t oficina-billing:${{ github.sha }} .
      - name: ECR publication pending configuration
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && (vars.AWS_REGION == '' || vars.AWS_ROLE_ARN_BILLING == '' || vars.ECR_REPOSITORY_BILLING == '')
        run: echo '::warning::ECR publication skipped; configure AWS_REGION, AWS_ROLE_ARN_BILLING and ECR_REPOSITORY_BILLING.'
      - name: Configure AWS credentials for ECR
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.AWS_REGION != '' && vars.AWS_ROLE_ARN_BILLING != '' && vars.ECR_REPOSITORY_BILLING != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_BILLING }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Login to ECR
        id: ecr-login
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.AWS_REGION != '' && vars.AWS_ROLE_ARN_BILLING != '' && vars.ECR_REPOSITORY_BILLING != ''
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push Billing image to ECR
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.AWS_REGION != '' && vars.AWS_ROLE_ARN_BILLING != '' && vars.ECR_REPOSITORY_BILLING != ''
        env:
          IMAGE_URI: ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY_BILLING }}:${{ github.sha }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_BILLING }}
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$GITHUB_SHA" >/dev/null 2>&1; then
            echo 'Image already exists in immutable ECR repository.'
          else
            docker tag oficina-billing:${{ github.sha }} "$IMAGE_URI"
            docker push "$IMAGE_URI"
          fi
      - name: K3s deploy pending configuration
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && (vars.SSM_DOCUMENT_BILLING == '' || vars.K3S_INSTANCE_ID == '')
        run: echo '::warning::K3s deploy skipped; configure SSM_DOCUMENT_BILLING and K3S_INSTANCE_ID.'
      - name: Deploy Billing in K3s through SSM
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.AWS_REGION != '' && vars.AWS_ROLE_ARN_BILLING != '' && vars.ECR_REPOSITORY_BILLING != '' && vars.SSM_DOCUMENT_BILLING != '' && vars.K3S_INSTANCE_ID != ''
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          SSM_DOCUMENT: ${{ vars.SSM_DOCUMENT_BILLING }}
          K3S_INSTANCE_ID: ${{ vars.K3S_INSTANCE_ID }}
        run: |
          set -euo pipefail
          command_id="$(aws ssm send-command --document-name "$SSM_DOCUMENT" --instance-ids "$K3S_INSTANCE_ID" --parameters "imageTag=$GITHUB_SHA" --query 'Command.CommandId' --output text)"
          status=Pending
          for attempt in {1..84}; do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$K3S_INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in Success) break;; Failed|Cancelled|TimedOut) break;; esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$K3S_INSTANCE_ID" --query '{Status:Status,Output:StandardOutputContent}'
          test "$status" = Success
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: billing-test-results
          path: |
            test-results/**/*.trx
            test-results/**/coverage.cobertura.xml
          if-no-files-found: ignore
