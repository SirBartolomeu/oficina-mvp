name: data-infra-ci

on:
  push:
    branches: [main]
    paths: ['infra/aws-data/**', '.github/workflows/data-infra-ci.yml']
  pull_request:
    branches: [main]
    paths: ['infra/aws-data/**', '.github/workflows/data-infra-ci.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Aplicar recursos AWS após revisão do plano e aprovação do ambiente aws-demo'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/aws-data fmt -check
      - run: terraform -chdir=infra/aws-data init -backend=false -input=false
      - run: terraform -chdir=infra/aws-data validate

  plan:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_INFRA_DATA }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Plan data resources
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_STATE_BUCKET: ${{ vars.AWS_STATE_BUCKET }}
        run: |
          test -n "$AWS_REGION" && test -n "$AWS_STATE_BUCKET"
          terraform -chdir=infra/aws-data init -input=false \
            -backend-config="bucket=$AWS_STATE_BUCKET" \
            -backend-config="key=oficina-fiap-demo/data.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform -chdir=infra/aws-data plan -input=false -out=plan.tfplan -var="aws_region=$AWS_REGION"
          terraform -chdir=infra/aws-data show -no-color plan.tfplan > infra/aws-data/plan.txt
      - uses: actions/upload-artifact@v4
        with:
          name: data-plan
          path: |
            infra/aws-data/plan.tfplan
            infra/aws-data/plan.txt
          retention-days: 1

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    needs: plan
    runs-on: ubuntu-latest
    environment: aws-demo
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: actions/download-artifact@v4
        with:
          name: data-plan
          path: infra/aws-data
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_INFRA_DATA }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Connect to reviewed state
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_STATE_BUCKET: ${{ vars.AWS_STATE_BUCKET }}
        run: |
          terraform -chdir=infra/aws-data init -input=false \
            -backend-config="bucket=$AWS_STATE_BUCKET" \
            -backend-config="key=oficina-fiap-demo/data.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Apply reviewed plan
        run: terraform -chdir=infra/aws-data apply -input=false -auto-approve plan.tfplan
