name: k3s-infra-ci

on:
  push:
    branches: [main]
    paths: ['infra/aws-k3s/**', 'services/Oficina.Auth/**', 'scripts/aws-demo/build-auth-lambda.ps1', '.github/workflows/k3s-infra-ci.yml']
  pull_request:
    branches: [main]
    paths: ['infra/aws-k3s/**', 'services/Oficina.Auth/**', 'scripts/aws-demo/build-auth-lambda.ps1', '.github/workflows/k3s-infra-ci.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Aplicar K3s/Auth após estado de dados, plano revisado e aprovação do ambiente aws-demo'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: hashicorp/setup-terraform@v3
      - name: Build initial Auth package
        shell: pwsh
        run: ./scripts/aws-demo/build-auth-lambda.ps1 -OutputPath infra/aws-k3s/artifacts/oficina-auth.zip
      - run: terraform -chdir=infra/aws-k3s fmt -check
      - run: terraform -chdir=infra/aws-k3s init -backend=false -input=false
      - run: terraform -chdir=infra/aws-k3s validate

  plan:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: hashicorp/setup-terraform@v3
      - name: Build initial Auth package
        shell: pwsh
        run: ./scripts/aws-demo/build-auth-lambda.ps1 -OutputPath infra/aws-k3s/artifacts/oficina-auth.zip
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_INFRA_K3S }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Plan K3s and Auth resources
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_STATE_BUCKET: ${{ vars.AWS_STATE_BUCKET }}
          GITHUB_OWNER: ${{ vars.GITHUB_OWNER }}
        run: |
          test -n "$AWS_REGION" && test -n "$AWS_STATE_BUCKET" && test -n "$GITHUB_OWNER"
          terraform -chdir=infra/aws-k3s init -input=false \
            -backend-config="bucket=$AWS_STATE_BUCKET" \
            -backend-config="key=oficina-fiap-demo/k3s.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform -chdir=infra/aws-k3s plan -input=false -out=plan.tfplan \
            -var="aws_region=$AWS_REGION" -var="github_owner=$GITHUB_OWNER" \
            -var="data_state_bucket=$AWS_STATE_BUCKET"
          terraform -chdir=infra/aws-k3s show -no-color plan.tfplan > infra/aws-k3s/plan.txt
      - uses: actions/upload-artifact@v4
        with:
          name: k3s-plan
          path: |
            infra/aws-k3s/plan.tfplan
            infra/aws-k3s/plan.txt
            infra/aws-k3s/artifacts/oficina-auth.zip
          retention-days: 1

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    needs: plan
    runs-on: ubuntu-latest
    environment: aws-demo
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: actions/download-artifact@v4
        with:
          name: k3s-plan
          path: infra/aws-k3s
      - name: Verify planned Auth package
        run: test -s infra/aws-k3s/artifacts/oficina-auth.zip
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_INFRA_K3S }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Connect to reviewed state
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_STATE_BUCKET: ${{ vars.AWS_STATE_BUCKET }}
        run: |
          terraform -chdir=infra/aws-k3s init -input=false \
            -backend-config="bucket=$AWS_STATE_BUCKET" \
            -backend-config="key=oficina-fiap-demo/k3s.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Apply reviewed plan
        run: terraform -chdir=infra/aws-k3s apply -input=false -auto-approve plan.tfplan
