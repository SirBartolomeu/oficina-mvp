services:
  otel-collector:
    volumes:
      - ./config/otel-collector-prometheus.yaml:/etc/otelcol/config.yaml:ro

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2h
      - --storage.tsdb.retention.size=128MB
    volumes:
      - ./config/prometheus-local.yaml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus-alerts.yaml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - otel-collector
      - blackbox

  blackbox:
    image: prom/blackbox-exporter:v0.28.0
    command: ["--config.file=/etc/blackbox/config.yml"]
    volumes:
      - ./config/blackbox-local.yaml:/etc/blackbox/config.yml:ro

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./config/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/prometheus.yaml:ro
      - ./config/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/oficina.yaml:ro
      - ./config/grafana/oficina.json:/var/lib/grafana/dashboards/oficina.json:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
