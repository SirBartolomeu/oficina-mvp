include classpath("application.conf")

node-address {
  port = 9324
}

rest-sqs {
  bind-port = 9324
}

queues {
  billing-workorders {
    defaultVisibilityTimeout = 15 seconds
    deadLettersQueue {
      name = "billing-workorders-dlq"
      maxReceiveCount = 3
    }
  }
  billing-workorders-dlq { }
  os-events {
    defaultVisibilityTimeout = 15 seconds
    deadLettersQueue {
      name = "os-events-dlq"
      maxReceiveCount = 3
    }
  }
  os-events-dlq { }
  execution-commands {
    defaultVisibilityTimeout = 15 seconds
    deadLettersQueue {
      name = "execution-commands-dlq"
      maxReceiveCount = 3
    }
  }
  execution-commands-dlq { }
}
