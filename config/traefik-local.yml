http:
  routers:
    auth:
      rule: Path(`/auth/token`)
      entryPoints: [websecure]
      middlewares: [auth-rate-limit]
      service: auth
      tls: {}
    os:
      rule: PathPrefix(`/api`)
      entryPoints: [websecure]
      service: os
      tls: {}
  services:
    auth:
      loadBalancer:
        servers:
          - url: http://auth-local:8080
    os:
      loadBalancer:
        servers:
          - url: http://oficina-api:8080
  middlewares:
    auth-rate-limit:
      rateLimit:
        average: 5
        period: 1s
        burst: 10
