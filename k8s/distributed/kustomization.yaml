apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: oficina
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - os.yaml
  - auth-lookup-nodeport.yaml
  - execution.yaml
  - billing.yaml
  - hpa.yaml

configMapGenerator:
  - name: oficina-os-config
    envs: [os.env]
  - name: oficina-execution-config
    envs: [execution.env]
  - name: oficina-billing-config
    envs: [billing.env]
