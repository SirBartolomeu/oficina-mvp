# Referência de chaves. Não aplicar com os valores REPLACE e não versionar Secrets reais.
apiVersion: v1
kind: Secret
metadata:
  name: oficina-os-secret
  namespace: oficina
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: "Host=REPLACE_RDS_HOST;Port=5432;Database=oficina_os;Username=oficina_os;Password=REPLACE"
  Jwt__Key: "REPLACE_WITH_RANDOM_KEY_AT_LEAST_32_CHARS"
  AdminCredentials__Password: "REPLACE_ADMIN_PASSWORD"
  Integration__Token: "REPLACE_INTEGRATION_TOKEN"
  Auth__LookupToken: "REPLACE_AUTH_LOOKUP_TOKEN_AT_LEAST_32_CHARS"
  Execution__InternalToken: "REPLACE_EXECUTION_INTERNAL_TOKEN_AT_LEAST_32_CHARS"
---
apiVersion: v1
kind: Secret
metadata:
  name: oficina-execution-secret
  namespace: oficina
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: "Host=REPLACE_RDS_HOST;Port=5432;Database=oficina_execution;Username=oficina_execution;Password=REPLACE"
  InternalToken: "REPLACE_EXECUTION_INTERNAL_TOKEN_AT_LEAST_32_CHARS"
---
apiVersion: v1
kind: Secret
metadata:
  name: oficina-billing-secret
  namespace: oficina
type: Opaque
stringData:
  InternalToken: "REPLACE_BILLING_INTERNAL_TOKEN_AT_LEAST_32_CHARS"
  MercadoPago__AccessToken: "REPLACE_MERCADO_PAGO_TEST_ACCESS_TOKEN"
  MercadoPago__ExternalPosId: "REPLACE_MERCADO_PAGO_TEST_POS_ID"
  MercadoPago__WebhookSecret: "REPLACE_MERCADO_PAGO_TEST_WEBHOOK_SECRET"
